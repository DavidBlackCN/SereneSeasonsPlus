plugins {
    id 'net.neoforged.gradle.neoform'
}
base.archivesName.set("${mod_name}-common")


sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    implementation "net.minecraft:neoform_joined:${neoform_version}"
    // Common-only compile-time deps used by shared utilities
    compileOnly "curse.maven:serene-seasons-291874:8938722"
    compileOnly "curse.maven:glitchcore-955399:9125343"
    compileOnly "maven.modrinth:betterdays:5jl3V5Dw"
    compileOnly group:'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly "org.ow2.asm:asm-tree:9.8"
    compileOnly group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-common", version: "${whitenoise_version}"
    compileOnly "curse.maven:gaboulibs-1367332:7495339"
    compileOnly "curse.maven:snow-real-magic-308663:7472610"
    testImplementation "org.ow2.asm:asm-tree:9.8"
    testRuntimeOnly "curse.maven:serene-seasons-291874:8938722"
}

// Small executable regression checks; no additional test framework is needed.
tasks.withType(Test).configureEach {
    // MigrationChecks is executed by checkMigration, not a JUnit test engine.
    failOnNoDiscoveredTests = false
}
tasks.register('checkMigration', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.Gabou.sereneseasonsplus.MigrationChecks'
}
tasks.named('check') { dependsOn tasks.named('checkMigration') }
