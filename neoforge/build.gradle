plugins {
    id 'net.neoforged.gradle.userdev'
//    id "net.neoforged.gradle.mixin" version '7.0.192'
    id 'com.hypherionmc.modutils.modpublisher' version '2.1.8'
    id "com.modrinth.minotaur"
}

base.archivesName.set("NeoForge-Version-${mod_name}")

sourceSets.test.java.srcDir project(':Common').file('src/test/java')

tasks.register('checkMigration', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.Gabou.sereneseasonsplus.MigrationChecks'
}
tasks.named('check') { dependsOn tasks.named('checkMigration') }


    runs {
        configureEach {
            modSource project.sourceSets.main
        }

        client {
            workingDirectory.set(project.file("run"))
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
            jvmArguments.add("-Ddevauth.enabled=true")
            jvmArguments.add("-Ddevauth.account=main")
            jvmArguments.add("-Dlog4j2.level=DEBUG")
        }

        server {
            workingDirectory.set(project.file("run"))
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
            jvmArguments.add("-Dlog4j2.level=DEBUG")
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientData {
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

dependencies {
    testImplementation "org.ow2.asm:asm-tree:9.8"
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly project(":Common") // Common sources and resources are bundled below.
    implementation "curse.maven:serene-seasons-291874:8938722"
    implementation "curse.maven:glitchcore-955399:9125343"
    implementation "maven.modrinth:betterdays:5jl3V5Dw"
    runtimeOnly "me.djtheredstoner:DevAuth-neoforge:1.2.1"
    compileOnly "curse.maven:project-atmosphere-1258344:7070436"
    implementation "maven.modrinth:spark:HwHxykP9"
    implementation "curse.maven:architectury-api-419699:9111315"
    // Compile against the existing API until the separate GabouLibs port is ready.
    compileOnly "curse.maven:gaboulibs-1367332:7495339"
    if (providers.gradleProperty('gaboulibs_neoforge_jar').isPresent()) {
        runtimeOnly files(providers.gradleProperty('gaboulibs_neoforge_jar').get())
    }
    compileOnly "curse.maven:snow-real-magic-308663:7472610"
    implementation group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-neoforge", version: "${whitenoise_version}"
    //runtimeOnly "curse.maven:rubidium-extra-654373:5176872"
    //runtimeOnly "curse.maven:embeddium-908741:5521869"
}
TaskCollection.metaClass.excludingNeoTasks = { ->
    delegate.matching { !it.name.startsWith("neo") }
}
tasks.named('compileJava', JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).excludingNeoTasks().configureEach {
    source(project(":Common").sourceSets.main.allJava)
}
tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}
tasks.named("sourcesJar", Jar) {
    from(project(":Common").sourceSets.main.allSource)
}
tasks.named('processResources', ProcessResources) {
    from project(":Common").sourceSets.main.resources
    filesMatching("${mod_id}.mixins.json") {
        expand "refmap_target": "sereneseasonplus."
    }
}
def neoforgeUploadJar = tasks.named("jar").flatMap { it.archiveFile }

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "4Al4H3t9"
    versionNumber = "NeoForge-${project.version}"
    versionName = "Serene Seasons Plus ${mod_version}"
    changelog = rootProject.file("SSPchangelog.md").text
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    versionType = "beta"
    dependencies {
        required.project "e0bNACJD"
        required.project "tPLE214j"
        optional.project "qIWoLcKJ"
    }
    uploadFile = neoforgeUploadJar
}

def curseForgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()
if (curseForgeToken) {
    publisher {
        apiKeys { curseforge curseForgeToken }
        setCurseID("1288843")
        setVersionType("release")
        setChangelog(rootProject.file("SSPchangelog.md"))
        setDisplayName("NeoForge-${project.version}")
        setGameVersions(minecraft_version)
        setLoaders("neoforge")
        setCurseEnvironment("both")
        getJavaVersions().set([JavaVersion.VERSION_25])
        setArtifact(neoforgeUploadJar.get().asFile)
        setDebug(providers.gradleProperty("publisherDebug").map { it.toBoolean() }.orElse(false).get())
    }
} else {
    project.logger.lifecycle("CURSEFORGE_TOKEN not set; CurseForge upload tasks will be disabled.")
    tasks.named("publishCurseforge").configure { enabled = false }
}

tasks.named("publishCurseforge").configure { dependsOn("build") }
tasks.register("curseforge1288843") {
    group = "publishing"
    description = "Publishes the NeoForge release to CurseForge project 1288843."
    dependsOn("publishCurseforge")
    enabled = curseForgeToken != null
}
