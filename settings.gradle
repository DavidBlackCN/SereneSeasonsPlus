pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://maven.fabricmc.net/'; content { includeGroupByRegex 'net\\.fabricmc.*'; includeGroup 'fabric-loom' } }
        maven { url 'https://maven.neoforged.net/releases'; content { includeGroupByRegex 'net\\.neoforged.*'; includeGroup 'net.minecraftforge' } }
    }
}

rootProject.name = 'gaboulibs'

include 'common'
include 'fabric'
include 'neoforge'

