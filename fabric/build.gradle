import io.github.themrmilchmann.gradle.publish.curseforge.ChangelogFormat
import io.github.themrmilchmann.gradle.publish.curseforge.ReleaseType
plugins {
    id "net.fabricmc.fabric-loom"
    id "io.github.themrmilchmann.curseforge-publish"
    id "com.modrinth.minotaur"
}
loom {
    mods { gaboulibs { sourceSet sourceSets.main } }
}

sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    compileOnly "curse.maven:serene-seasons-291874:8938722"
}
processResources {
    inputs.property 'version', project.version
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand version: project.version
    }
}

curseforge {
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    publications {
        register("curseForge") {
            projectId = "1367332"

            gameVersion rootProject.curseforge_minecraft_version_type, rootProject.curseforge_minecraft_version
            gameVersion "modloader", "fabric"
            gameVersion "environment", "client"
            gameVersion "environment", "server"

            artifacts.register("main") {
                displayName = "Fabric-${project.version}"
                releaseType = ReleaseType.RELEASE

                changelog {
                    format = ChangelogFormat.MARKDOWN
                    from(rootProject.file("GabousLibs.md"))
                }

                from(tasks.named("jar"))
            }
        }
    }
}

def packagedJar = tasks.named("jar").flatMap { it.archiveFile }

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "N8aGZtvj"
    versionNumber = "Fabric-${project.version}"
    versionName = "Gabou's Libs ${mod_version}"
    changelog = rootProject.file("GabousLibs.md").text
    gameVersions = [rootProject.minecraft_version]
    loaders = ["fabric"]
    versionType = "release"
    uploadFile = packagedJar
}


