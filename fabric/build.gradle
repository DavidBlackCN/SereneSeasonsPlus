plugins {
    id "net.fabricmc.fabric-loom" version "1.17.21"
    id 'com.hypherionmc.modutils.modpublisher' version '2.1.8'
    id "com.modrinth.minotaur"
}
base.archivesName.set("Fabric-Version-${mod_id}")

sourceSets.test.java.srcDir project(':Common').file('src/test/java')
tasks.register('checkMigration', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.Gabou.sereneseasonsplus.MigrationChecks'
}
tasks.named('check') { dependsOn tasks.named('checkMigration') }
tasks.named('sourcesJar', Jar) {
    from(project(':Common').sourceSets.main.allSource)
}

loom {
    // Sépare les sources client et serveur
    mixin {
        defaultRefmapName.set("sereneseasonsplus-refmap.json")
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            vmArg "-Ddevauth.enabled=true"
            vmArg "-Ddevauth.account=main"
            vmArg "-Dlog4j2.level=DEBUG"
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
            vmArg "-Dlog4j2.level=DEBUG"
        }
    }
}

// Inclut les ressources du common
processResources {
    from project(":Common").sourceSets.main.resources
}
tasks.named('compileJava', JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}
tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

dependencies {
    testImplementation "org.ow2.asm:asm-tree:9.8"
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    include implementation("com.electronwill.night-config:toml:${nightconfig_version}")
    include implementation("com.electronwill.night-config:core:${nightconfig_version}")
    include implementation("net.jodah:typetools:0.6.3")
    compileOnly project(":Common") // Common sources and resources are bundled above.
    implementation "maven.modrinth:betterdays:nGUdicIW"
    compileOnly "curse.maven:snow-real-magic-fabric-560441:7472578"
    implementation "curse.maven:serene-seasons-291874:8938724"
    implementation "curse.maven:glitchcore-955399:9125345"
    runtimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.1")
    runtimeOnly("org.apache.httpcomponents:httpclient:4.5.13")
    implementation "com.terraformersmc:modmenu:21.0.0"
    implementation "curse.maven:architectury-api-419699:9111314"
    // GabouLibs is being ported separately. Use its existing Mojang-named API
    // for compilation only; never load the old intermediary Fabric jar on 26.3.
    compileOnly "curse.maven:gaboulibs-1367332:7495339"
    if (providers.gradleProperty('gaboulibs_fabric_jar').isPresent()) {
        runtimeOnly files(providers.gradleProperty('gaboulibs_fabric_jar').get())
    }
    implementation group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-fabric", version: "${whitenoise_version}"
}

def fabricUploadJar = tasks.named("jar").flatMap { it.archiveFile }

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "4Al4H3t9"
    versionNumber = "Fabric-${project.version}"
    versionName = "Serene Seasons Plus ${mod_version}"
    changelog = rootProject.file("SSPchangelog.md").text
    gameVersions = [minecraft_version]
    loaders = ["fabric"]
    versionType = "beta"
    dependencies {
        required.project "e0bNACJD"
        required.project "tPLE214j"
        required.project "mOgUt4GM"
    }
    uploadFile = fabricUploadJar
}

def curseForgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()
if (curseForgeToken) {
    publisher {
        apiKeys { curseforge curseForgeToken }
        setCurseID("1288843")
        setVersionType("release")
        setChangelog(rootProject.file("SSPchangelog.md"))
        setDisplayName("Fabric-${project.version}")
        setGameVersions(minecraft_version)
        setLoaders("fabric")
        setCurseEnvironment("both")
        getJavaVersions().set([JavaVersion.VERSION_25])
        setArtifact(fabricUploadJar.get().asFile)
        setDebug(providers.gradleProperty("publisherDebug").map { it.toBoolean() }.orElse(false).get())
    }
} else {
    project.logger.lifecycle("CURSEFORGE_TOKEN not set; CurseForge upload tasks will be disabled.")
    tasks.named("publishCurseforge").configure { enabled = false }
}

tasks.named("publishCurseforge").configure { dependsOn("build") }
tasks.register("curseforge1288843") {
    group = "publishing"
    description = "Publishes the Fabric release to CurseForge project 1288843."
    dependsOn("publishCurseforge")
    enabled = curseForgeToken != null
}
